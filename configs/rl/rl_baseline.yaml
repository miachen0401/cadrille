# Cadrille RL §8 — ess + IoU shaped reward, paper-recipe (h100_bs128_grpo).
#
# Per-row reward composition (in worker via common.metrics):
#   if family has essential_ops spec:   reward = 0.2 * ess_score + 0.8 * iou
#   else (DC/Fu rows):                  reward = iou
#
# Hyperparams from h100_bs128_grpo.yaml (paper Table 14):
#   effective batch_size=128 via mini_batch_size=16 (8 grad-accum chunks),
#   G=16, top_N=16 (full GRPO, no CPPO clipping), eps=0.1 sym,
#   entropy_coef=0, batch_updates=3, max_new_tokens=512.
#   lr=5e-5 (user override; paper 3e-5 — slightly hot but Qwen3-VL is stable).
#
# Pool: candidates_bench3500_dc2000_fu1500.pkl (7000 rows, bench:dc+fu = 50:50,
# bench is IID-only — 10 OOD families excluded by build_holdout_split).
#
# 7000 examples / 128 = ~55 steps/epoch.
# max_steps=600 ≈ 11 epochs. ETA on single A100: ~3-5 days (8-10 min/step).

checkpoints_dir: /root/autodl-tmp/checkpoints

mode: cppo
checkpoint_path: /root/autodl-tmp/checkpoints/rl-baseline-pureiou-600/resume_seed

data_dir: null
train_modality: img
hard_examples_pkl: ./data/_rl/candidates_baseline_dc2000_fu1500.pkl
dpo_dataset: null

base_model: Qwen/Qwen3-VL-2B-Instruct
backbone: qwen3_vl

# Training — paper-faithful effective bs=128
max_steps: 600
lr: 2.0e-5

# Dr. CPPO / GRPO official settings (top_N=G=16 → pure GRPO, no clipping)
G: 16
top_N: 4
eps_high: 0.1
eps_low: 0.1
entropy_coef: 0.00
batch_updates: 3
batch_size: 128                   # effective prompts per step (= 8 mini × mini_batch_size, matches h100_bs128.yaml)
mini_batch_size: 16               # 8 grad-accum chunks (proven by h100_bs128.yaml)
max_new_tokens: 512
rollout_temperature: 1.0
reward_normalization: false
reward_workers: 24                # March default; RLIMIT_AS=12GB per worker (in metrics.py) caps any single OCCT explosion
use_buffer: false
buffer_sample_size: 1
buffer_expand_frac: 0.5
buffer_max_size: 4096
eval_batch_size: 32
eval_workers: 24
eval_timeout: 120.0
sequential_generation: false      # G=16 batched generation fits in 80 GB

adv_std_norm: false
soft_invalid_reward: -1.0

# Essential-ops reward shaping — ENABLED
essential_reward_weight: 0.2
essential_reward_mode: fractional

curriculum: false

# Validation — DC50 + Fu50 + benchcad val IID/OOD (paper + IID/OOD breakdown).
# val_benchcad_pkl: per-row family + ess_score; eval logs eval/img/bc_{iid,ood}/*
val_deepcad_dir:       ./data/deepcad_test_mesh
val_fusion360_dir:     ./data/fusion360_test_mesh
val_samples_deepcad:   50
val_samples_fusion360: 50
val_benchcad_pkl:      ./data/benchcad/val.pkl
val_samples_benchcad:  200            # bench val has ~1815 rows; 200 ≈ ~180 IID + ~20 OOD
val_modalities:        img
eval_steps: 30                    # paper uses 5 — that's overkill; 30 ≈ every ~half-epoch

log_steps: 2
save_steps: 30
save_total_limit: 10

hf_upload_repo: Hula0401/cadrille-rl-ess-iou-from-ood50k-24k
hf_upload_private: false

wandb_project: cadrille-rl-ess-iou
wandb_offline: false
run_name: rl-ess-iou-0.2-bs128-G16-from-ood50k-24k
