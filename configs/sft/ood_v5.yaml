# §7 robustness — ood_v5: NEW 10 mech families held out (vs v1's bolt/bucket/...).
#
# Same recipe as ood_enhanced_v2 (the paper's "ood" line), only the holdout
# family list differs. Tests whether the OOD plateau (ess_pass ≈ 0.30-0.45)
# is robust to which 10 families are picked, or specific to v1's choice.
#
# Selection of v5 holdout: same criterion as v1 (v3 baseline iou_mean ≥ 0.5,
# n ≥ 5, exclude v1 holdout + 3 v3-fail families), random.seed(42) sample(10):
#   capsule, clevis_pin, cruciform, dog_bone, heat_sink,
#   i_beam, locator_block, rivet, stepped_shaft, vented_panel
#
# bench/iso pkls: data/{benchcad,cad-iso-106}/train_v5_holdout.pkl
# (built once via build_holdout_split.py; rename hardcoded v4 output → v5).

checkpoints_dir: /ephemeral/checkpoints
data_path: ./data
mode: img
use_text: true
backbone: qwen3_vl
base_model: Qwen/Qwen3-VL-2B-Instruct

max_steps: 20000
batch_size: 8
accumulation_steps: 4
learning_rate: 2.0e-4
warmup_steps: 2000
lr_scheduler_type: cosine
weight_decay: 0.01
bf16: true
gradient_checkpointing: true
dataloader_workers: 4
group_by_length: true

log_steps: 50
save_steps: 2000
eval_steps: 1000
online_eval_n_per: 50
max_iou_k: 0
eval_on_start: true

resume_from_checkpoint: null
run_name: null
seed: 42
max_code_len: 1500

# Same mix as ood_enhanced_v2 — only difference is which 10 mech are held out.
sft_mix_weights:
  benchcad:             21
  cad_iso_106:         233
  benchcad_simple:      79
  benchcad_easy:         0
  text2cad_bench_img:   61
  text2cad_bench_text:  61
  recode_bench:        545

# v5 holdout — see comment header.
holdout_families:
  - capsule
  - clevis_pin
  - cruciform
  - dog_bone
  - heat_sink
  - i_beam
  - locator_block
  - rivet
  - stepped_shaft
  - vented_panel

benchcad_train_pkl: train_v5_holdout.pkl
cad_iso_106_train_pkl: train_v5_holdout.pkl
benchcad_simple_train_pkl: train_v2_holdout.pkl

curriculum_phases: null
save_only_model: false
save_total_limit: 4

hf_upload_repo: Hula0401/cadrille-qwen3vl-2b-ood-v5-20k
hf_upload_private: false
wandb_project: cadrille-sft
